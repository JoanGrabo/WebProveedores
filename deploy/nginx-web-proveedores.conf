# Ejemplo de sitio Nginx (Ubuntu) como proxy inverso hacia Next.js + PM2 en el puerto 3000.
#
# Instalación:
#   sudo cp deploy/nginx-web-proveedores.conf /etc/nginx/sites-available/web-proveedores
#   sudo ln -s /etc/nginx/sites-available/web-proveedores /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificado TLS (Let's Encrypt):
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d tu-dominio.com

upstream next_web_proveedores {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name tu-dominio.com www.tu-dominio.com;

    # Tras certbot, descomenta la redirección HTTPS o deja que certbot la añada.
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://next_web_proveedores;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    client_max_body_size 25M;
}

